[project]
name = "odoo-mcp"
version = "0.1.0"
description = "MCP server for Odoo: partners, sales orders, stock levels and invoices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # 2.x renamed FastMCP to MCPServer, the code below depends on that name.
    "mcp>=2.1",
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.scripts]
odoo-mcp = "src.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Coverage is a gate, not a report: the threshold lives in make check.
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F is the pycodestyle and pyflakes base, the rest catches what review would
# catch anyway: import order, dead upgrades, bare except, pointless branches.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests need no decorator, every coroutine test just runs.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
# The threshold lives here and nowhere else, so make check and CI cannot drift
# apart on what counts as enough.
fail_under = 70
