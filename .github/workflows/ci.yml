name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The client tests call a real Odoo, so CI runs the same stand a developer
      # runs. Started first and waited for later: the first boot builds the
      # database, and it can do that while the linters work.
      - name: Start Odoo
        run: docker compose up -d db odoo

      # Same uv version as the Dockerfile, so a green CI means the image builds too.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      # The four steps of make check, split so a failure names itself.
      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy --strict src

      # Holds until the healthcheck passes, so the database is really built.
      - name: Wait for Odoo
        run: make up

      - name: Tests
        env:
          # Without it a missing Odoo would skip the client tests and CI would
          # stay green while covering nothing.
          ODOO_REQUIRED: "1"
        run: uv run pytest -q

      - name: Odoo logs on failure
        if: failure()
        run: docker compose logs --tail=100 odoo
