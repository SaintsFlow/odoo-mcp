services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      # Odoo creates its own database, so postgres only needs a place to log in.
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    # First start creates the database and loads demo data, which takes a couple
    # of minutes. The modules listed here are the ones our tools read from:
    # partners come with base, orders with sale_management, quantities with
    # stock, invoices with account. Demo data is on by default, so no flag.
    #
    # l10n_at is the Austrian localization, and the product is built for the
    # Austrian market. It does not convert the American demo companies, it adds
    # a third one with euros and the Austrian chart of accounts, so the demo
    # carries both and the tools have real Austrian invoices to read.
    command: ["odoo", "-d", "odoo", "-i", "base,sale_management,stock,account,l10n_at"]
    volumes:
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      # start_period covers the long first boot, retries cover a slow machine.
      start_period: 120s
      retries: 60

  mcp:
    build: .
    depends_on:
      odoo:
        condition: service_healthy
    # Every value falls back to the demo stand, so a fresh clone runs with no
    # .env at all. Compose reads .env by itself, so anything set there wins.
    environment:
      ODOO_URL: ${ODOO_URL:-http://odoo:8069}
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-admin}
      ODOO_READONLY: ${ODOO_READONLY:-}
      ODOO_TIMEOUT: ${ODOO_TIMEOUT:-30}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      # Loopback is the default in code on purpose. Inside a container it would
      # mean "reachable by nobody", so here it listens on the container's own
      # interfaces and the port mapping below decides who gets in.
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Inside the container the port is fixed; on the host it can move, because
    # 8080 is a popular port and something else may already hold it.
    ports:
      - "${MCP_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  odoo-db:
  odoo-data:
